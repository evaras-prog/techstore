<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore Admin - Editar Producto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="admin-wrapper">

        <header class="admin-topbar">
            🛒 TechStore — Panel de Administración
        </header>

        <aside class="admin-sidebar">
            <a href="index.html">📊 Dashboard</a>
            <a href="productos.html" class="activo">📦 Productos</a>
            <a href="agregar-producto.html">➕ Agregar producto</a>
            <a href="usuarios.html">👥 Usuarios</a>
            <a href="pedidos.html">🧾 Pedidos</a>
            <a href="../index.html">🌐 Ver sitio</a>
        </aside>

        <main class="admin-contenido">
            <h1>Editar producto</h1>

            <div class="contenedor-formulario" style="max-width:600px; margin:0;">
                <form>
                    <div class="grupo-campo">
                        <label for="nombre-prod">Nombre del producto</label>
                        <input type="text" id="nombre-prod" value="Laptop Ultrabook Pro">
                    </div>
                    <div class="grupo-campo">
                        <label for="precio-prod">Precio</label>
                        <input type="number" id="precio-prod" value="599990">
                    </div>
                    <div class="grupo-campo">
                        <label for="stock-prod">Stock</label>
                        <input type="number" id="stock-prod" value="12">
                    </div>
                    <div class="grupo-campo">
                        <label for="categoria-prod">Categoría</label>
                        <select id="categoria-prod">
                            <option value="">Selecciona categoría</option>
                            <option selected>Laptops</option>
                            <option>Smartphones</option>
                            <option>Audio</option>
                            <option>Accesorios</option>
                        </select>
                    </div>
                    <div class="grupo-campo">
                        <label for="desc-prod">Descripción</label>
                        <textarea id="desc-prod" rows="4">Laptop de alto rendimiento con procesador Intel Core i7, 16GB RAM y 512GB SSD.</textarea>
                    </div>
                    <div style="display:flex; gap:1rem;">
                        <button type="submit" class="btn btn-primario" style="flex:1;">
                            Guardar cambios
                        </button>
                        <a href="productos.html" class="btn btn-secundario" style="flex:1; text-align:center;">
                            Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </main>

    </div>
</body>
</html>
